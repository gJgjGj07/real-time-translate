[api]
base_url = http://localhost:11434/v1/
api_key = dummy-key

[translation]
model = qwen2.5:3b
target_lang = Chinese
threads = 4

[display]
display_duration = 10
window_width = 1000
window_height = 180

[transcription]
backend = mlx
whisper_model = large-v3-turbo
device = auto
compute_type = float16
source_language = en
transcription_workers = 2

[audio]
device_index = 2
sample_rate = 16000
silence_threshold = 0.015
silence_duration = 0.7
chunk_duration = 0.1
max_phrase_duration = 6
streaming_mode = true
streaming_interval = 2
streaming_step_size = 0.2
update_interval = 0.4
streaming_overlap = 0.3
